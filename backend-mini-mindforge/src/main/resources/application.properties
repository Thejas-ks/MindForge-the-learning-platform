spring.application.name=backend-mini-mindforge

# Database — set DATABASE_URL as a full JDBC URL in Render env vars
# Example: jdbc:mysql://<host>:3306/<db>?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false

# SambaNova AI
sambanova.api.key=${SAMBANOVA_API_KEY}

# Google OAuth
google.client.id=${GOOGLE_CLIENT_ID}

# JWT
jwt.secret=${JWT_SECRET}

# CORS — comma-separated list of allowed frontend origins
allowed.origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# Server — Render injects PORT automatically
server.port=${PORT:8080}

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.thejas=INFO
logging.level.org.springframework.security=WARN
