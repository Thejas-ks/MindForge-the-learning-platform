spring.application.name=backend-mini-mindforge

# Database — Render provides DATABASE_URL as postgresql://user:pass@host/db
# DataSourceConfig bean converts it to jdbc:postgresql:// automatically
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Logging — DB connection visibility on startup
logging.level.com.zaxxer.hikari=INFO
logging.level.org.hibernate.dialect=INFO

# AI Providers
sambanova.api.key=${SAMBANOVA_API_KEY}
groq.api.key=${GROQ_API_KEY}

# Google OAuth
google.client.id=${GOOGLE_CLIENT_ID}

# JWT
jwt.secret=${JWT_SECRET}

# CORS — comma-separated list of allowed frontend origins
allowed.origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# Server — Render injects PORT automatically
server.port=${PORT:8080}

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.thejas=INFO
logging.level.org.springframework.security=WARN
